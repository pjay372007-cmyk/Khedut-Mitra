version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: krishiai-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - krishiai-network

  backend:
    build: ./backend
    container_name: krishiai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=production_jwt_signing_key_change_in_real_deploy
      - SESSION_SECRET=production_express_session_secret_cookie_key
      - DB_URI=mongodb://mongodb:27017/krishiai
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80
    depends_on:
      - mongodb
    networks:
      - krishiai-network

  frontend:
    build: ./frontend
    container_name: krishiai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - krishiai-network

volumes:
  mongo-data:

networks:
  krishiai-network:
    driver: bridge
